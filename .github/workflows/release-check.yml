name: Release check

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  release-check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies (frozen lockfile)
        run: npm run ci:deps

      - name: Release gate
        run: npm run release:check
