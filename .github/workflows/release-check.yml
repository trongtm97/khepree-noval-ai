name: Release check (legacy)

# Kept for branch history. Prefer ci.yml (normal) + release.yml (signed package).
# Disabled on push — was duplicating CI and flaking when running ci:check as one step.
# Manual only if needed for archaeology.
on:
  workflow_dispatch:

jobs:
  release-check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies (frozen lockfile)
        run: npm run ci:deps

      - name: Install Playwright Chromium
        run: npx playwright install chromium

      - name: Typecheck + critical lint + unit + integration
        run: npm run ci:check
