name: Release check (legacy)

# Kept for branch history. Prefer ci.yml (normal) + release.yml (signed package).
# This workflow no longer fails the whole gate on historical full-lint debt
# or missing production signing secrets.
on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  release-check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies (frozen lockfile)
        run: npm run ci:deps

      - name: Typecheck + critical lint + unit + integration
        run: npm run ci:check
