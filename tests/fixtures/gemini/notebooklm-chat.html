<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <title>NotebookLM Fixture — Chat</title>
</head>
<body>
  <main data-testid="notebooklm-app" data-notebooklm-app="1" data-surface="notebooklm">
    <div data-testid="notebook-context" data-notebook-context="1">
      Notebook: [NovelTrans] NotebookLM Fixture
    </div>
    <!-- Discover Sources distractor -->
    <textarea
      disabled
      readonly
      formcontrolname="discoverSourcesQuery"
      aria-label="Khám phá nguồn dựa trên truy vấn đã nhập"
    ></textarea>
    <section class="chat-panel" data-testid="active-thread" data-active-thread="1">
      <div data-testid="message-list">
        <div class="chat-message-pair">
          <div class="to-user-container" data-testid="assistant-response" data-assistant-response="1">
            <div class="message-text-content">Previous NotebookLM reply.</div>
          </div>
        </div>
        <!-- Nested text must NOT count as a second assistant message -->
        <div class="chat-message-pair">
          <div class="to-user-container" data-assistant-response="1" data-testid="assistant-response">
            <div class="message-text-content">Second bubble.</div>
            <div class="message-text-content">Nested duplicate text node.</div>
          </div>
        </div>
      </div>
      <query-box class="chat-input">
        <textarea
          class="query-box-input"
          data-testid="prompt-input"
          aria-label="Hộp truy vấn"
          placeholder="Đặt câu hỏi hoặc tạo nội dung"
          rows="2"
        ></textarea>
      </query-box>
      <button
        type="button"
        class="actions-enter-button"
        data-testid="send-prompt"
        data-action="send-prompt"
        aria-label="Gửi"
        disabled
      >
        Gửi
      </button>
      <div data-testid="response-list" data-response-list="1"></div>
    </section>
  </main>
  <script>
    const input = document.querySelector('[data-testid="prompt-input"]');
    const send = document.querySelector('[data-testid="send-prompt"]');
    input.addEventListener('input', () => {
      send.disabled = !input.value.trim();
    });
  </script>
</body>
</html>
