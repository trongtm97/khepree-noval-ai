<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Gemini Fixture — Chat Ready</title>
</head>
<body>
  <main data-testid="gemini-app" data-gemini-app="1">
    <div data-testid="notebook-context" data-notebook-context="1">
      Notebook: [NovelTrans] Fixture Novel
    </div>
    <button type="button" data-testid="new-chat" data-action="new-chat">New chat</button>
    <ul data-testid="thread-list" data-thread-list="1"></ul>
    <section data-testid="active-thread" data-active-thread="1" style="display:none">
      <textarea
        data-testid="prompt-input"
        data-prompt-input="1"
        aria-label="Prompt"
        rows="4"
        style="width:100%"
      ></textarea>
      <button type="button" data-testid="send-prompt" data-action="send-prompt">Send</button>
      <button type="button" data-testid="stop-generation" data-action="stop-generation" style="display:none">
        Stop
      </button>
      <div data-testid="loading-indicator" data-generating="0" style="display:none">
        Generating…
      </div>
      <div data-testid="response-list" data-response-list="1">
        <div
          data-testid="assistant-response"
          data-assistant-response="1"
          data-correlation-id="00000000-0000-4000-8000-000000000001"
          data-streaming="0"
        >
          Previous conversation output (old correlation).
        </div>
      </div>
    </section>
  </main>
  <script>
    const params = new URLSearchParams(location.search);
    const notebookName = params.get('notebook') || '[NovelTrans] Fixture Novel';
    document.querySelector('[data-testid="notebook-context"]').textContent =
      'Notebook: ' + notebookName;

    const newChatBtn = document.querySelector('[data-testid="new-chat"]');
    const activeThread = document.querySelector('[data-testid="active-thread"]');
    const promptInput = document.querySelector('[data-testid="prompt-input"]');
    const sendBtn = document.querySelector('[data-testid="send-prompt"]');
    const stopBtn = document.querySelector('[data-testid="stop-generation"]');
    const loading = document.querySelector('[data-testid="loading-indicator"]');
    const responseList = document.querySelector('[data-testid="response-list"]');

    let streamTimer = null;
    let cancelled = false;

    function extractCorrelation(text) {
      const m = text.match(/\[NTS-CORR:([0-9a-f-]{36})\]/i);
      return m ? m[1] : null;
    }

    newChatBtn.addEventListener('click', () => {
      activeThread.style.display = 'block';
      promptInput.value = '';
    });

    stopBtn.addEventListener('click', () => {
      cancelled = true;
      if (streamTimer) clearInterval(streamTimer);
      loading.style.display = 'none';
      loading.setAttribute('data-generating', '0');
      stopBtn.style.display = 'none';
    });

    sendBtn.addEventListener('click', () => {
      const text = promptInput.value;
      const correlationId = extractCorrelation(text);
      if (!correlationId) return;

      cancelled = false;
      loading.style.display = 'block';
      loading.setAttribute('data-generating', '1');
      stopBtn.style.display = 'inline-block';

      const bubble = document.createElement('div');
      bubble.setAttribute('data-testid', 'assistant-response');
      bubble.setAttribute('data-assistant-response', '1');
      bubble.setAttribute('data-correlation-id', correlationId);
      bubble.setAttribute('data-streaming', '1');
      bubble.textContent = '';
      responseList.appendChild(bubble);

      const full = [
        '<TRANSLATION>',
        '[C000001:P000001] Bản dịch thử nghiệm.',
        '</TRANSLATION>',
        '<TERM_DELTA>[]</TERM_DELTA>',
      ].join('\n');

      let idx = 0;
      streamTimer = setInterval(() => {
        if (cancelled) return;
        idx += 1;
        bubble.textContent = full.slice(0, idx);
        if (idx >= full.length) {
          clearInterval(streamTimer);
          bubble.setAttribute('data-streaming', '0');
          loading.style.display = 'none';
          loading.setAttribute('data-generating', '0');
          stopBtn.style.display = 'none';
        }
      }, 15);
    });

    // Auto-open thread for direct navigation
    activeThread.style.display = 'block';
  </script>
</body>
</html>
